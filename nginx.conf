server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VitePress 生成的是 xxx.html，而文章 permalink 是无扩展名路径（如 /posts/java）。
    # 依次尝试：原路径 -> 加 .html -> 目录 -> 404 页面。
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|svg|woff2?|ttf|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 禁止访问隐藏文件（如 .git）
    location ~ /\. {
        deny all;
    }
}
