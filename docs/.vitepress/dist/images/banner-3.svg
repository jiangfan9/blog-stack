<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="plane2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="180" r="480" fill="url(#glowA)"/>
  <circle cx="280" cy="740" r="460" fill="url(#glowB)"/>

  <!-- 漂浮纸飞机 -->
  <g opacity="0.95">
    <g transform="translate(1180,300) rotate(-12)">
      <path d="M0 0 L150 34 L40 60 L28 108 L14 62 Z" fill="url(#plane1)"/>
      <path d="M0 0 L40 60 L14 62 Z" fill="#c7d2fe"/>
    </g>
    <g transform="translate(420,220) rotate(8) scale(0.7)">
      <path d="M0 0 L150 34 L40 60 L28 108 L14 62 Z" fill="url(#plane2)"/>
      <path d="M0 0 L40 60 L14 62 Z" fill="#fcd34d"/>
    </g>
    <g transform="translate(900,140) rotate(-6) scale(0.5)">
      <path d="M0 0 L150 34 L40 60 L28 108 L14 62 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- 飞行轨迹虚线 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 12" stroke-linecap="round">
    <path d="M1120 420 C 900 500 700 380 520 470"/>
    <path d="M380 300 C 260 360 180 300 90 370"/>
  </g>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="1230" cy="640" rx="110" ry="34"/>
    <ellipse cx="1300" cy="624" rx="78" ry="40"/>
    <ellipse cx="240" cy="180" rx="90" ry="30"/>
    <ellipse cx="296" cy="166" rx="60" ry="36"/>
  </g>

  <!-- 起伏山丘 -->
  <path d="M0 720 C 260 640 460 780 740 700 C 1020 620 1320 760 1600 690 L1600 900 L0 900 Z" fill="url(#hillA)" opacity="0.9"/>
  <path d="M0 800 C 300 720 540 850 860 770 C 1160 696 1380 830 1600 770 L1600 900 L0 900 Z" fill="url(#hillB)" opacity="0.8"/>

  <!-- 小花点缀 -->
  <g opacity="0.9">
    <g transform="translate(200,820)"><circle r="9" fill="#fef3c7"/><g fill="#ffffff"><ellipse cx="0" cy="-14" rx="6" ry="10"/><ellipse cx="0" cy="14" rx="6" ry="10"/><ellipse cx="-14" cy="0" rx="10" ry="6"/><ellipse cx="14" cy="0" rx="10" ry="6"/></g><circle r="6" fill="#fbbf24"/></g>
    <g transform="translate(1380,830) scale(0.85)"><circle r="9" fill="#fecdd3"/><g fill="#ffffff"><ellipse cx="0" cy="-14" rx="6" ry="10"/><ellipse cx="0" cy="14" rx="6" ry="10"/><ellipse cx="-14" cy="0" rx="10" ry="6"/><ellipse cx="14" cy="0" rx="10" ry="6"/></g><circle r="6" fill="#f472b6"/></g>
    <g transform="translate(760,850) scale(0.7)"><circle r="9" fill="#fef3c7"/><g fill="#ffffff"><ellipse cx="0" cy="-14" rx="6" ry="10"/><ellipse cx="0" cy="14" rx="6" ry="10"/><ellipse cx="-14" cy="0" rx="10" ry="6"/><ellipse cx="14" cy="0" rx="10" ry="6"/></g><circle r="6" fill="#fbbf24"/></g>
  </g>

  <!-- 星光 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="160" cy="360" r="3"/><circle cx="600" cy="480" r="2.5"/><circle cx="1480" cy="520" r="3"/>
    <circle cx="820" cy="300" r="2"/><circle cx="1080" cy="560" r="2.5"/>
  </g>
</svg>
