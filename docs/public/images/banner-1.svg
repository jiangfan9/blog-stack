<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="72%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="balloonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="balloonYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="balloonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1300" cy="200" r="440" fill="url(#sun)"/>
  <circle cx="1300" cy="200" r="80" fill="#fff7d6" opacity="0.9"/>

  <!-- 蓬松云朵 -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="260" cy="180" rx="130" ry="46"/>
    <ellipse cx="340" cy="156" rx="94" ry="52"/>
    <ellipse cx="188" cy="150" rx="78" ry="40"/>
    <ellipse cx="980" cy="120" rx="100" ry="36"/>
    <ellipse cx="1040" cy="102" rx="70" ry="40"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="620" cy="300" rx="80" ry="28"/>
    <ellipse cx="672" cy="286" rx="54" ry="32"/>
  </g>

  <!-- 彩虹弧 -->
  <g fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M1080 760 A 400 400 0 0 1 1880 760" stroke="#fb7185" stroke-width="18"/>
    <path d="M1104 760 A 376 376 0 0 1 1856 760" stroke="#fbbf24" stroke-width="18"/>
    <path d="M1128 760 A 352 352 0 0 1 1832 760" stroke="#34d399" stroke-width="18"/>
    <path d="M1152 760 A 328 328 0 0 1 1808 760" stroke="#38bdf8" stroke-width="18"/>
  </g>

  <!-- 飘浮气球 -->
  <g>
    <g transform="translate(300,470)">
      <ellipse cx="0" cy="0" rx="46" ry="58" fill="url(#balloonPink)"/>
      <ellipse cx="-14" cy="-18" rx="12" ry="20" fill="#ffffff" opacity="0.35"/>
      <path d="M0 58 L-8 82 L8 82 Z" fill="#f43f5e"/>
      <path d="M0 82 C -18 110 18 130 0 160" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(470,390)">
      <ellipse cx="0" cy="0" rx="38" ry="48" fill="url(#balloonYellow)"/>
      <ellipse cx="-12" cy="-15" rx="10" ry="16" fill="#ffffff" opacity="0.4"/>
      <path d="M0 48 L-7 68 L7 68 Z" fill="#fbbf24"/>
      <path d="M0 68 C 14 92 -14 108 0 134" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(150,560)">
      <ellipse cx="0" cy="0" rx="34" ry="44" fill="url(#balloonBlue)"/>
      <ellipse cx="-10" cy="-14" rx="9" ry="15" fill="#ffffff" opacity="0.4"/>
      <path d="M0 44 L-6 62 L6 62 Z" fill="#38bdf8"/>
      <path d="M0 62 C -12 84 12 98 0 122" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- 起伏山丘 -->
  <path d="M0 760 C 260 660 480 800 760 720 C 1040 640 1300 780 1600 700 L1600 900 L0 900 Z" fill="url(#hillA)" opacity="0.85"/>
  <path d="M0 820 C 300 740 520 860 840 780 C 1140 706 1360 840 1600 780 L1600 900 L0 900 Z" fill="url(#hillB)" opacity="0.55"/>

  <!-- 闪光光点 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="120" cy="360" r="3"/><circle cx="560" cy="190" r="2.5"/><circle cx="820" cy="420" r="3"/>
    <circle cx="1180" cy="500" r="2.5"/><circle cx="1420" cy="360" r="3"/><circle cx="700" cy="560" r="2"/>
    <circle cx="1520" cy="140" r="2.5"/><circle cx="400" cy="640" r="2"/>
  </g>
</svg>
