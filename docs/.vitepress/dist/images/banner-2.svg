<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="38%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="180" r="440" fill="url(#glow)"/>
  <circle cx="1280" cy="180" r="92" fill="#fffaf0" opacity="0.85"/>

  <!-- 甜甜圈式光环 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <circle cx="1280" cy="180" r="150"/>
    <circle cx="1280" cy="180" r="210"/>
    <circle cx="1280" cy="180" r="270"/>
  </g>

  <!-- 彩色圆点气泡 -->
  <g opacity="0.75">
    <circle cx="200" cy="200" r="34" fill="#fde68a" opacity="0.7"/>
    <circle cx="330" cy="320" r="22" fill="#fff1f2" opacity="0.8"/>
    <circle cx="120" cy="440" r="16" fill="#fed7aa" opacity="0.85"/>
    <circle cx="560" cy="160" r="26" fill="#fecdd3" opacity="0.8"/>
    <circle cx="720" cy="380" r="18" fill="#fff7ed" opacity="0.7"/>
    <circle cx="980" cy="140" r="20" fill="#fde68a" opacity="0.75"/>
    <circle cx="1480" cy="480" r="28" fill="#fff1f2" opacity="0.7"/>
  </g>

  <!-- 波浪层叠 -->
  <path d="M0 620 C 240 520 440 700 720 600 C 1000 500 1220 690 1600 560 L1600 900 L0 900 Z" fill="url(#wave1)" opacity="0.9"/>
  <path d="M0 700 C 280 610 500 780 800 680 C 1080 588 1320 760 1600 660 L1600 900 L0 900 Z" fill="url(#wave2)" opacity="0.85"/>
  <path d="M0 780 C 320 700 560 850 900 750 C 1180 670 1400 810 1600 740 L1600 900 L0 900 Z" fill="url(#wave3)" opacity="0.8"/>
  <path d="M0 850 C 300 790 540 900 860 820 C 1160 748 1380 870 1600 810 L1600 900 L0 900 Z" fill="#be185d" opacity="0.35"/>

  <!-- 闪烁星星 -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M180 300 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z"/>
    <path d="M640 240 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z"/>
    <path d="M1120 460 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z"/>
    <path d="M1420 300 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
  </g>
</svg>
